        <script>
  try {
    const prefs = JSON.parse(localStorage.getItem('prefs') || '{}');
    const root = document.documentElement;
    if (prefs.fontScale) root.style.setProperty('--font-scale', prefs.fontScale);
    if (prefs.contrast) root.classList.add('high-contrast');
    if (prefs.reduceMotion) root.classList.add('reduce-motion');
    if (prefs.dyslexia) root.classList.add('dyslexia-font');
  } catch (e) {}
</script>
